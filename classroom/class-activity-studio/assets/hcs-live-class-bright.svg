<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 16 380 86" role="img" aria-label="HCS Live Class">
  <defs>
    <linearGradient id="meshBright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <!-- Live Bright mark lock (Howard prefers tip geometry). Wordmark bumped
       so two-line block top↔bottom matches mark: pill y=18 → dots bottom y=100.
       font-size 44 · baselines 50 / 100 · soft white #f8fafc · Nest type stack. -->
  <rect x="8" y="18" width="96" height="22" rx="11" fill="url(#meshBright)"/>
  <circle cx="20" cy="58" r="10" fill="#22d3ee"/>
  <circle cx="56" cy="58" r="10" fill="#facc15"/>
  <circle cx="92" cy="58" r="10" fill="#fb7185"/>
  <circle cx="20" cy="90" r="10" fill="#22d3ee"/>
  <circle cx="56" cy="90" r="10" fill="#facc15"/>
  <text x="128" y="50" font-family="Segoe UI, system-ui, sans-serif" font-size="44" font-weight="400" fill="#f8fafc">HCS</text>
  <text x="128" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="44" font-weight="400" fill="#f8fafc">Live Class</text>
</svg>
